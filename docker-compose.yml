# EMS - máy chủ (PostgreSQL + Redis + backend): docker compose up -d --build
# API: http://localhost:8080/api/v1  ·  Swagger: http://localhost:8080/swagger-ui.html
# Người dùng dùng ứng dụng desktop (desktop/) trỏ tới http://<địa-chỉ-máy-chủ>:8080
# File tài liệu mặc định lưu trong volume "files". Muốn dùng MinIO (S3): xem cuối file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ems
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ${EMS_DB_PASSWORD:-ems}
    ports: ["${EMS_DB_PORT:-5440}:5432"]   # 5440 để không đụng PostgreSQL cài sẵn trên máy (thường 5432-5434)
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      EMS_DB_URL: jdbc:postgresql://postgres:5432/ems
      EMS_DB_USER: ems
      EMS_DB_PASSWORD: ${EMS_DB_PASSWORD:-ems}
      EMS_JWT_SECRET: ${EMS_JWT_SECRET:-doi-chuoi-nay-khi-trien-khai-that-toi-thieu-32-ky-tu!!}
      EMS_ADMIN_PASSWORD: ${EMS_ADMIN_PASSWORD:-Admin@12345}
      EMS_CACHE_TYPE: redis
      EMS_REDIS_HOST: redis
      EMS_CACHE_REDIS_HEALTH: "true"
      EMS_STORAGE_TYPE: local
      EMS_STORAGE_LOCAL_ROOT: /app/data/files
      EMS_CORS_ORIGINS: http://localhost:8081,http://localhost:5173
    ports: ["8080:8080"]
    volumes: [files:/app/data]

volumes:
  pgdata:
  files:

