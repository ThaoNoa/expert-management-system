name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Profile full (mặc định): Flyway + Testcontainers PostgreSQL 16 (runner có sẵn Docker)
      - run: mvn -B verify

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrate + test nghiệp vụ ở tầng DB
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls backend/src/main/resources/db/migration/V*.sql | sort -V); do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f db-tests/T01__business_rules.sql

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
      - name: Đóng gói app-image (EMS.exe kèm Java runtime)
        shell: pwsh
        run: .\build-installer.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: EMS-windows
          path: desktop/target/installer/EMS
